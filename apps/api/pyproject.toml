[project]
name = "targetlens-api"
version = "1.0.0"
description = "TargetLens FastAPI research workspace API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0.38,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.15,<2.0",
  "redis>=5.2,<6.0",
  "tenacity>=9.0,<10.0",
  "structlog>=25.1,<26.0",
  "python-multipart>=0.0.20,<1.0",
  "orjson>=3.10,<4.0",
  "celery>=5.4,<6.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
